schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]
[task]
name = "karotte-fixture/honest-add"
[metadata]
language = "python"
expect = "solved"
[verifier]
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 300.0
[verifier.environment]
cpus = 2
memory_mb = 2048
storage_mb = 4096
[[verifier.collect]]
command = "cd /app && mkdir -p /logs/artifacts && git config --global --add safe.directory /app && git diff --binary 689776aa2f2adb0dfda17b928e844c9d0219ed63 HEAD > /logs/artifacts/model.patch"
timeout_sec = 60.0
[agent]
network_mode = "no-network"
timeout_sec = 600.0
[environment]
docker_image = "karotte-harbor-fixture:1"
cpus = 2
memory_mb = 2048
storage_mb = 4096
